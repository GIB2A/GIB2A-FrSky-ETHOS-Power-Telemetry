name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua syntax
        run: luac -p 'GIB2A PW/main.lua'
      - name: Validate package
        shell: pwsh
        run: ./tools/validate_release.ps1
